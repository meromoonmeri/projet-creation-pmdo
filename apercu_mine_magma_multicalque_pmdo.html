  <style>
    :root {

      --panel: #141e38;
      --panel-2: #1b294c;
      --border: #314b82;
      --accent: #ff944d;
      --accent-2: #ffd180;
      --ok: #5be39b;
      --text: #f3f6ff;
      --muted: #a6b7d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #24182c 0%, var(--bg) 68%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(12, 18, 36, 0.94);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    header h1 {
      margin: 0;
      font-size: 1.18rem;
      letter-spacing: 0.01em;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .map-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .map-tab {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }
    .map-tab.active {
      background: linear-gradient(180deg, #b83b14, #7a2108);
      border-color: var(--accent-2);
      color: #fff;
    }
    main {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px 24px 40px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 395px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1120px) {
      main { grid-template-columns: 1fr; }
    }
    .stage-card, .side-card {
      background: rgba(20, 30, 56, 0.93);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .stage-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .wind-pill {
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 0.8rem;
      color: var(--accent-2);
    }
    .canvas-wrap {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      background: #060912;
      border: 1px solid #243864;
      border-radius: 10px;
      padding: 12px;
      overflow-x: auto;
    }
    canvas, .ref-preview {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-radius: 4px;
      max-width: 100%;
      height: auto;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
    }
    .ref-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .ref-box.visible { display: flex; }
    .ref-caption {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .controls {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid #243c6a;
    }
    button.ctrl {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 12px;
      font-size: 0.84rem;
      cursor: pointer;
    }
    button.ctrl.active {
      background: #9e3816;
      border-color: var(--accent-2);
    }
    input[type="range"] {
      flex: 1;
      min-width: 150px;
      accent-color: var(--accent);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .metric {
      background: var(--panel-2);
      border: 1px solid #294375;
      border-radius: 8px;
      padding: 9px 11px;
    }
    .metric .k { font-size: 0.74rem; color: var(--muted); }
    .metric .v { font-size: 0.98rem; font-weight: 700; margin-top: 2px; color: var(--ok); }
    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 430px;
      overflow-y: auto;
    }
    .layer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      background: var(--panel-2);
      border: 1px solid #264070;
      border-radius: 7px;
      font-size: 0.82rem;
    }
    .layer-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex: 1;
    }
    .badge {
      font-size: 0.71rem;
      padding: 2px 6px;
      border-radius: 5px;
      background: #233c6b;
      color: #cfe2ff;
      white-space: nowrap;
    }
    .badge.anim {
      background: #5b2512;
      color: #ffd180;
    }
    .dl-btn {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 14px;
      padding: 11px 14px;
      background: linear-gradient(180deg, #c24116, #842608);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      border-radius: 8px;
      border: 1px solid var(--accent-2);
    }
    .status-line {
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>

      showRef = !showRef;
      e.target.classList.toggle('active', showRef);
      document.getElementById('refBox').classList.toggle('visible', showRef);
    });
    document.getElementById('allOnBtn').addEventListener('click', () => {
      m.layers.forEach((L) => layerEnabled.set(`${m.id}:${L.slug}`, true));
      document.querySelectorAll('#layerList input[type="checkbox"]').forEach((c) => c.checked = true);
      renderCurrentFrame();
    });
    document.getElementById('animOnlyBtn').addEventListener('click', () => {
      m.layers.forEach((L) => layerEnabled.set(`${m.id}:${L.slug}`, L.poses > 1));
      document.querySelectorAll('#layerList input[type="checkbox"]').forEach((c, idx) => {
        c.checked = m.layers[idx].poses > 1;
      });
      renderCurrentFrame();
    });

    buildTabs();
    initMap().then(() => requestAnimationFrame(tick));
  </script>
</body>
</html>
