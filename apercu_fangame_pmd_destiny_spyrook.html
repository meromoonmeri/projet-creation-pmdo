<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon Mystery Dungeon : Destiny — Opening « Peinture » (vidéo 60 fps)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0818;color:#efe6ff;font:14px/1.4 system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  video{max-width:100vw;max-height:calc(100vh - 70px);aspect-ratio:16/9;background:#000;box-shadow:0 0 40px #5b3fa088;border-radius:6px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding:0 10px}
  a,button{color:#2a1b45;background:linear-gradient(180deg,#ffe9b8,#e8a96a);border:1px solid #4a2b5e;border-radius:7px;padding:5px 11px;font-weight:700;font-size:12px;text-decoration:none;cursor:pointer}
  small{opacity:.75}
</style>
</head>
<body>
<video id="v" controls playsinline preload="auto" src="./renders/pmd_destiny_fangame_v1/opening_spyrook/opening_spyrook_60fps.mp4"></video>
<div class="bar">
  <button id="play">▶ Lancer avec la musique</button>
  <a href="./apercu_fangame_pmd_destiny_ultime.html">Version temps réel (Ultime)</a>
  <a href="./index.html">Studio</a>
  <small>Vidéo générée à l'avance — 153 s, Full HD 1920×1080, 60 images/s, caméra de dessin animé, décors repeints à la main (crayon + encre + couleur), personnages lissés, ombres violettes, lueur, contour fin.</small>
</div>
<div id="yt" style="position:fixed;left:-9999px;width:2px;height:2px"></div>
<script>
// Musique : même morceau que l'Ultime (2aafI3XvKxo), synchronisé sur la vidéo muette.
(function(){
  var v=document.getElementById('v'),player=null,ready=false;
  var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
  window.onYouTubeIframeAPIReady=function(){player=new YT.Player('yt',{videoId:'2aafI3XvKxo',playerVars:{controls:0,playsinline:1},events:{onReady:function(){ready=true;}}});};
  function sync(){if(!ready||!player)return;var d=Math.abs(player.getCurrentTime()-v.currentTime);if(d>0.35)player.seekTo(v.currentTime,true);}
  v.addEventListener('play',function(){if(ready){player.seekTo(v.currentTime,true);player.playVideo();}});
  v.addEventListener('pause',function(){if(ready)player.pauseVideo();});
  v.addEventListener('seeked',sync);setInterval(sync,1500);
  document.getElementById('play').onclick=function(){v.currentTime=0;v.play();};
})();
</script>
</body>
</html>
